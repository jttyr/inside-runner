name: Desempeño por Sector

# Genera y publica sectors.json (Finviz, gratis).
#
# NO usa el `schedule` nativo de GitHub como disparador principal: en repos
# privados de poco trafico llega tarde y a rafagas, o de plano no llega (asi
# se paso un fin de semana entero sin correr). El disparador real es
# cron-job.org -> repository_dispatch, igual que premarket-discord en
# market-drivers. `schedule` se deja nada mas como respaldo suelto, cada 2
# horas, por si cron-job.org fallara.
#
# Cadencia pedida: cada 15 min de 06:00 a 12:00 MX (mercado recien abierto,
# donde el precio se mueve mas), cada hora el resto del dia.

on:
  # Se ejecuta justo despues de cada corrida de Market Drivers (premarket 06:32 MX y
  # actualizacion de apertura): asi macro y sectores salen siempre a la misma hora que ellos.
  workflow_run:
    workflows: [premarket-discord, market-open-update]
    types: [completed]
  repository_dispatch:
    types: [run-sectors]
  workflow_dispatch:
  schedule:
    # Respaldo propio (no depende de cron-job.org): cada 15 min con el mercado de EE.UU. abierto
    # (12:00-20:45 UTC = 06:00-14:45 MX, lun-vie) y cada hora el resto del tiempo.
    - cron: "*/15 12-20 * * 1-5"
    - cron: "0 21-23,0-11 * * *"

concurrency:
  group: data-macro-indicators
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jttyr/macro-indicators
          token: ${{ secrets.RUNNER_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar desempeño por sector
        run: python fetch_sectors.py

      - name: Publicar en rama data
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/jttyr/macro-indicators.git"
          rm -rf /tmp/data-branch
          if git clone --quiet --branch data --single-branch "$REPO_URL" /tmp/data-branch 2>/dev/null; then
            cd /tmp/data-branch
          else
            mkdir -p /tmp/data-branch && cd /tmp/data-branch
            git init --quiet
            git remote add origin "$REPO_URL"
            git checkout --quiet --orphan data
          fi
          mkdir -p latest
          cp "$GITHUB_WORKSPACE/output/sectors.json" latest/sectors.json
          git add -A
          git commit --quiet -m "actualizar sectores $(date -u +%FT%TZ)" --allow-empty
          git push --quiet origin data --force
