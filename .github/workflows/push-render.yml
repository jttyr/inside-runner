name: push-render

# Empuja a la terminal (Render) los datos de GEX, Market Drivers, valuacion, macro,
# sectores, historial de precios y tipo de cambio. Asi la pagina funciona aunque la
# instancia de Render no tenga salida a internet. Se dispara solo cada ~5 min y
# tambien desde cron-job.org (repository_dispatch: run-push-render).

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [run-push-render]
  workflow_dispatch:

concurrency:
  group: push-render
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: empujar datos
        env:
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python -W ignore scripts/push_to_render.py

  # El GEX de la terminal arranca solo de 04:00 a 07:55 MX (10:00-13:55 UTC, lunes a viernes): este reloj
  # (cron-job.org + schedule, cada 5 min) es el fiable, asi que desde aqui se lanza gex-intraday, que antes de
  # las 08:00 MX solo genera datos (sin imagenes ni Discord). Si ya hubo una corrida hace menos de ~4 min
  # (p. ej. porque cron-job.org tambien la disparo) no se repite.
  madrugada:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: lanzar GEX de madrugada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(date -u +%H); d=$(date -u +%u); ny=$(TZ=America/New_York date +%H)
          # desde las 04:00 NY (hora de Nueva York: sigue sola el cambio de horario)
          if [ "$d" -gt 5 ] || [ "$((10#$ny))" -lt 4 ] || [ "$h" -ge 14 ]; then
            echo "fuera de la ventana de madrugada (dia $d, $h UTC): nada que lanzar"; exit 0
          fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gex-intraday.yml --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$last" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
            if [ "$age" -lt 240 ]; then echo "ya hubo una corrida hace ${age}s: no se repite"; exit 0; fi
          fi
          gh workflow run gex-intraday.yml --repo "$GITHUB_REPOSITORY" && echo "GEX de madrugada lanzado"
